[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "propgraph-mcp"
version = "0.1.0"
description = "PropGraph MCP: Autonomous CRE underwriting swarm using temporal Graph-RAG over municipal deed streams and SEC filings"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Zein Dergham" }]
dependencies = [
    "pydantic>=2.5.0",
    "networkx>=3.0",
    "mcp>=1.0.0",
    "click>=8.1.0",
    "rich>=13.0.0",
    "httpx>=0.24.0",
]

[project.scripts]
propgraph = "propgraph_mcp.cli:cli"
propgraph-mcp = "propgraph_mcp.cli:cli"

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = [
    "ignore::pytest.PytestConfigWarning",
]
